
<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        /* Navigation Bar */
        nav {
            background-color: black;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 18px;
        }

        nav a:hover {
            color: orange;
        }

        /* Main Content */
        .content {
            background-color: lightblue;
            text-align: center;
            padding: 100px;
        }

        h1 {
            color: darkblue;
        }

        button {
            background-color: orange;
            padding: 10px 20px;
            border: none;
        }

        /* Footer */
        footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <!-- Main Content -->
    <div class="content">
        <h1>Welcome to My Website</h1>

        <p>This is my first HTML and CSS webpage.</p>

        <button>Click Here</button>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 My Website</p>
        <p>All Rights Reserved</p>
    </footer>

</body>
</html>

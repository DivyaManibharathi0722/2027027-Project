
<!DOCTYPE html>
<html>
<head>
    <title>My Image Gallery</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        .gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .gallery img {
            width: 250px;
            height: 180px;
            border: 3px solid white;
            border-radius: 10px;
        }

        .gallery img:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <h1>My Image Gallery</h1>

    <div class="gallery">

        <img src="https://picsum.photos/id/1015/400/300" alt="Nature">

        <img src="https://picsum.photos/id/1016/400/300" alt="Mountain">

        <img src="https://picsum.photos/id/1025/400/300" alt="Dog">

        <img src="https://picsum.photos/id/1035/400/300" alt="Forest">

        <img src="https://picsum.photos/id/1043/400/300" alt="River">

        <img src="https://picsum.photos/id/1050/400/300" alt="Nature">

    </div>

</body>
</html>

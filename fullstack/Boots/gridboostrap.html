<!doctype html>
<html lang="en" >
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Boostrap Grid!</title>
  </head>
  <body>
    <h1 class="text-center text-white bg-dark">Boostrap grid!:)</h1>
    <!-- Grid Classes

The Bootstrap 5 grid system has six classes:

    .col- (extra small devices - screen width less than 576px)
    .col-sm- (small devices - screen width equal to or greater than 576px)
    .col-md- (medium devices - screen width equal to or greater than 768px)
    .col-lg- (large devices - screen width equal to or greater than 992px)
    .col-xl- (xlarge devices - screen width equal to or greater than 1200px)
    .col-xxl- (xxlarge devices - screen width equal to or greater than 1400px) -->

<div class="container-fluid">
  <div class="row text-center  ">
      <div class="col-sm-3 bg-dark text-white col-md-4 bg-warning col-lg-6 bg-info h-[500px] ">col-3</div>
      <div class="col-sm-3 bg-danger col-md-4 bg-info  col-lg-6 bg-secondary h-500">col-6</div>
      <div class="col-sm-6 bg-warning col-lg-6 col-md-4 bg-muted h-500">col-3</div>
  </div>
</div>

<div class="container my-5">
  <div class="row">
    <div class="col-1 bg-danger">span1</div>
    <div class="col-1 bg-info">span2</div>
    <div class="col-1 bg-danger">span3</div>
    <div class="col-1 bg-secondary">span4</div>
    <div class="col-1 bg-danger">span5</div>
    <div class="col-1 bg-light">span6</div>
    <div class="col-1 bg-warning">span7</div>
    <div class="col-1 bg-info">span8</div>
    <div class="col-1 bg-warning">span9</div>
    <div class="col-1 bg-danger ">span10</div>
    <div class="col-1 bg-secondary">span11</div>
    <div class="col-1 bg-dark text-muted">span12</div>
    </div>
</div>

<div class="container-fluid my-5">
  <div class="row text-center text-white">
    <div class="col-sm-6  bg-primary">span1
      <div class="row">
        <div class="col-sm-6 bg-success" >col-1
          <div class="row">
            <div class="col-sm-3 bg-dark">1</div>
            <div class="col-sm-3 bg-info">2</div>
            <div class="col-sm-3 bg-primary">3</div>
            <div class="col-sm-3 bg-success">4</div>
          </div>
        </div>
        <div class="col-sm-6 bg-primary">col-2</div>
      </div>
    </div>
    <div class="col-sm-6 bg-info" >span2</div>
  </div>
</div>

<!-- forms in boostrap -->

<div class="container-fluid">
  <div class="row">
    <div class="col-sm-6">
      <h1 class="text-center">login form</h1>
      <form >
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Email address</label>
          <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
          <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
        </div>
        <div class="mb-3">
          <label for="exampleInputPassword1" class="form-label">Password</label>
          <input type="password" class="form-control" id="exampleInputPassword1">
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="exampleCheck1">
          <label class="form-check-label" for="exampleCheck1">Check me out</label>
        </div>
        <button type="submit" class="btn btn-outline-primary">Submit</button>
      </form>
    </div>
    <div class="col-sm-6">
      <div class="spinner-border "></div>
      <div class="spinner-border text-muted"></div>
      <div class="spinner-border text-primary"></div>
      <div class="spinner-border text-success"></div>
      <div class="spinner-border text-info"></div>
      <div class="spinner-border text-warning"></div>
      <div class="spinner-border text-danger"></div>
      <div class="spinner-border text-secondary"></div>
      <div class="spinner-border text-dark"></div>
      <div class="spinner-border text-light"></div>
  </div>
</div>


  </body>
</html>
